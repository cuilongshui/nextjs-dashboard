services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - next_node_modules:/app/node_modules
      - next_cache:/app/.next
    command: pnpm dev
    restart: unless-stopped

volumes:
  next_node_modules:
  next_cache:
